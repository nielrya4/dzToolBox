<div id="preview_output_modal" class="modal" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="frame">
                <div class="modal-header">
                    <h5 class="modal-title" id="preview_title">Preview Output</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="preview_modal_body" style="overflow: auto; max-height: 70vh;">
                    <div id="preview_zoom_container"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal" id="discard_preview_btn">Discard</button>
                    <button type="button" class="btn btn-primary" id="save_preview_btn">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="keep_current_btn" style="display: none;">Keep current</button>
                    <button type="button" class="btn btn-primary" id="keep_new_btn" style="display: none;">Keep new</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .preview-compare-label {
        font-weight: 600;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 4px;
        margin-bottom: 12px;
    }
    #preview_modal_body img {
        max-width: 100%;
        height: auto;
        display: block;
    }
</style>

<script>
    let pendingOutputs = [];
    const ZOOM_LEVELS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2, 3, 4];
    let currentZoomIndex = ZOOM_LEVELS.indexOf(1);

    // Initialize tabbed outputs
    function initializeTabbedOutputs() {
        console.log('Initializing tabbed outputs...');
        var tabbedContainers = document.querySelectorAll('.tabbed-output-container');
        console.log('Found', tabbedContainers.length, 'tabbed containers');

        tabbedContainers.forEach(function(container) {
            var outputId = container.getAttribute('data-tabbed-output-id');
            console.log('Processing container with ID:', outputId);
            if (!outputId) return;

            var tabButtons = container.querySelectorAll('button[data-bs-toggle="tab"]');
            var tabContent = container.querySelector('.tab-content');

            console.log('Found', tabButtons.length, 'tab buttons');
            console.log('Tab content container:', tabContent);

            if (!tabContent) {
                console.error('No tab-content container found!');
                return;
            }

            var tabPanes = tabContent.querySelectorAll('.tab-pane');
            console.log('Found', tabPanes.length, 'tab panes');

            // Log first tab pane content
            if (tabPanes.length > 0) {
                console.log('First tab pane ID:', tabPanes[0].id);
                console.log('First tab pane HTML (first 500 chars):', tabPanes[0].innerHTML.substring(0, 500));
                console.log('First tab pane display style:', tabPanes[0].style.display);
                var img = tabPanes[0].querySelector('img');
                console.log('First tab pane img element:', img);
                if (img) {
                    console.log('Img src (first 100 chars):', img.src.substring(0, 100));
                }
            }

            tabButtons.forEach(function(btn, btnIndex) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('Tab clicked:', btn.textContent, 'index:', btnIndex);

                    // Hide all panes (remove Bootstrap's show/active classes)
                    tabPanes.forEach(function(pane) {
                        pane.classList.remove('active', 'show');
                    });

                    // Remove active from all buttons
                    tabButtons.forEach(function(b) {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });

                    // Show selected pane (add Bootstrap's show/active classes)
                    var targetId = btn.getAttribute('data-bs-target');
                    var targetPane = document.querySelector(targetId);
                    console.log('Target pane:', targetId, 'found:', !!targetPane);
                    if (targetPane) {
                        targetPane.classList.add('active', 'show');
                        console.log('Showing pane, classes:', targetPane.className);
                    }

                    // Mark button as active
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                });
            });

            // Ensure first tab is active after initialization
            if (tabButtons.length > 0 && tabPanes.length > 0) {
                console.log('Activating first tab...');
                // Activate first button
                tabButtons[0].classList.add('active');
                tabButtons[0].setAttribute('aria-selected', 'true');

                // Activate first pane
                tabPanes[0].classList.add('active', 'show');
                console.log('First tab activated. Classes:', tabPanes[0].className);
            }
        });
    }

    // Set when a preview is comparing a reconfigured output with the one it would replace
    let pendingReconfigure = null;

    function newOutputGroupId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function setPreviewMode(comparing) {
        document.getElementById('preview_title').textContent =
            comparing ? 'Reconfigured Output: Current vs New' : 'Preview Output';
        document.querySelector('#preview_output_modal .modal-dialog').classList.toggle('modal-xl', comparing);
        document.getElementById('discard_preview_btn').style.display = comparing ? 'none' : '';
        document.getElementById('save_preview_btn').style.display = comparing ? 'none' : '';
        document.getElementById('keep_current_btn').style.display = comparing ? '' : 'none';
        document.getElementById('keep_new_btn').style.display = comparing ? '' : 'none';
    }

    function generateOutput(url) {
        // A reconfigure (see reconfigure_outputs.html) is consumed by the next generated output
        var reconfigure = reconfigureContext;
        reconfigureContext = null;
        show_output_spinner();
        fetch(url)
            .then(function(response) {
                if (!response.ok) throw new Error('Failed to generate output');
                return response.json();
            })
            .then(function(data) {
                // Remember the request so the outputs can be reconfigured later; a reconfigured
                // version keeps its group id so it can be reconfigured again
                var groupId = reconfigure ? reconfigure.groupId : newOutputGroupId();
                pendingOutputs = data.outputs.map(function(o) {
                    return Object.assign({}, o, { source_url: url, group_id: groupId });
                });
                pendingReconfigure = reconfigure;

                var container = document.getElementById('preview_zoom_container');
                var newHtml = pendingOutputs.map(function(o) {
                    return '<div class="mb-3">' + o.output_data + '</div>';
                }).join('');
                setPreviewMode(!!reconfigure);
                if (reconfigure) {
                    container.innerHTML =
                        '<div class="row g-3">' +
                        '<div class="col-6"><div class="preview-compare-label">Current</div><div id="preview_current"></div></div>' +
                        '<div class="col-6"><div class="preview-compare-label">New</div>' + newHtml + '</div>' +
                        '</div>';
                    var currentColumn = document.getElementById('preview_current');
                    reconfigure.current.forEach(function(node) {
                        currentColumn.appendChild(node.cloneNode(true));
                    });
                } else {
                    container.innerHTML = newHtml;
                }
                container.querySelectorAll('form').forEach(function(form) {
                    form.remove();
                });

                // Tell HTMX to process the preview content (needed for any remaining HTMX elements)
                if (typeof htmx !== 'undefined') {
                    htmx.process(container);
                }

                resetZoom();

                // Initialize any tabbed outputs
                setTimeout(function() {
                    initializeTabbedOutputs();
                }, 100);

                // Process any Plotly plots
                setTimeout(function() {
                    container.querySelectorAll('script[type="text/javascript"]').forEach(function(script) {
                        try {
                            eval(script.textContent);
                        } catch (e) {
                            console.error('Error executing Plotly script:', e);
                        }
                    });
                }, 150);

                bootstrap.Modal.getOrCreateInstance(document.getElementById('preview_output_modal')).show();
            })
            .catch(function(error) {
                console.error('Error generating output:', error);
            })
            .finally(function() {
                hide_output_spinner();
            });
    }

    function applyZoom() {
        var zoom = ZOOM_LEVELS[currentZoomIndex];
        document.getElementById('preview_zoom_container').style.zoom = zoom;
    }

    function resetZoom() {
        currentZoomIndex = ZOOM_LEVELS.indexOf(1);
        applyZoom();
    }

    document.addEventListener('keydown', function(e) {
        var modal = document.getElementById('preview_output_modal');
        if (!modal.classList.contains('show')) return;

        if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
            e.preventDefault();
            if (currentZoomIndex < ZOOM_LEVELS.length - 1) {
                currentZoomIndex++;
                applyZoom();
            }
        } else if (e.ctrlKey && e.key === '-') {
            e.preventDefault();
            if (currentZoomIndex > 0) {
                currentZoomIndex--;
                applyZoom();
            }
        } else if (e.ctrlKey && e.key === '0') {
            e.preventDefault();
            resetZoom();
        } else if (e.key === 'Escape') {
            bootstrap.Modal.getInstance(modal).hide();
        }
    });

    // Put an outputs list returned by the server into the page and bring its plots to life
    function showOutputsList(containerId, html) {
        var container = document.getElementById(containerId);
        container.innerHTML = html;

        // Tell HTMX to process the dynamically added content
        if (typeof htmx !== 'undefined') {
            htmx.process(container);
        }

        // Reinitialize tabbed outputs after inserting new HTML
        if (typeof initializeTabbedOutputs === 'function') {
            setTimeout(function() {
                initializeTabbedOutputs();
            }, 100);
        }

        // Process any Plotly plots
        setTimeout(function() {
            container.querySelectorAll('script[type="text/javascript"]').forEach(function(script) {
                try {
                    eval(script.textContent);
                } catch (e) {
                    console.error('Error executing Plotly script:', e);
                }
            });
        }, 150);
    }

    function postOutputs(endpoint, body, containerId) {
        show_save_spinner();
        return fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(function(response) {
            if (!response.ok) throw new Error('Failed to save output');
            return response.text();
        })
        .then(function(html) {
            showOutputsList(containerId, html);
            bootstrap.Modal.getInstance(document.getElementById('preview_output_modal')).hide();
        })
        .catch(function(error) {
            console.error('Error saving output:', error);
        })
        .finally(function() {
            hide_save_spinner();
        });
    }

    document.getElementById('save_preview_btn').addEventListener('click', function() {
        // Use appropriate endpoint based on output type
        var saveEndpoint = isMultivariateOutput
            ? '/projects/{{ project_id }}/multivariate/outputs/save'
            : '/projects/{{ project_id }}/outputs/save';
        var outputContainerId = isMultivariateOutput ? 'multivariate_outputs' : 'outputs_container';
        postOutputs(saveEndpoint, { outputs: pendingOutputs }, outputContainerId);
    });

    // Replace the reconfigured outputs with the new version, in the same place in the list
    document.getElementById('keep_new_btn').addEventListener('click', function() {
        if (!pendingReconfigure) return;
        var multivariate = pendingReconfigure.multivariate;
        var replaceEndpoint = multivariate
            ? '/projects/{{ project_id }}/multivariate/outputs/replace'
            : '/projects/{{ project_id }}/outputs/replace';
        postOutputs(replaceEndpoint,
                    { group_id: pendingReconfigure.groupId, outputs: pendingOutputs },
                    multivariate ? 'multivariate_outputs' : 'outputs_container');
    });

    // Reset flag when discarding
    document.getElementById('discard_preview_btn').addEventListener('click', function() {
        isMultivariateOutput = false;
        pendingOutputs = [];
    });

    // Also reset when modal is hidden (in case user clicks outside, uses Escape, or keeps
    // the current version of a reconfigured output)
    document.getElementById('preview_output_modal').addEventListener('hidden.bs.modal', function() {
        isMultivariateOutput = false;
        pendingOutputs = [];
        pendingReconfigure = null;
        setPreviewMode(false);
    });
</script>
